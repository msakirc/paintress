[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "paintress"
version = "0.1.0"
description = "Image-generation caller for Pollinations, Hugging Face and a local ComfyUI/A1111 server, with output checks."
readme = "README.md"
license = "MIT"
authors = [{ name = "Sakir Cimen" }]
keywords = ["image-generation", "stable-diffusion", "comfyui", "huggingface", "kutai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Framework :: AsyncIO",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Graphics",
]
requires-python = ">=3.10"
dependencies = ["clair_obscur @ git+https://github.com/msakirc/clair-obscur.git", "renoir @ git+https://github.com/msakirc/renoir.git", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/msakirc/paintress"
Repository = "https://github.com/msakirc/paintress"
Monorepo = "https://github.com/msakirc/kutai/tree/main/packages/paintress"

[tool.setuptools.packages.find]
where = ["src"]
